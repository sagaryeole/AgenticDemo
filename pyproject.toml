[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Installs the shared `common` package into the venv (editable), so `adk eval`
# and any other entry point can import `common.models` without PYTHONPATH.
[tool.hatch.build.targets.wheel]
packages = ["common"]

[project]
name = "agentic-demo"
version = "0.1.0"
description = "Step-by-step Google ADK tutorial: one new agent concept per folder."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "a2a-sdk[http-server]>=0.3.4,<2",
    "google-adk[extensions]>=2.10.0",
    "google-cloud-aiplatform>=2.2.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "mcp>=2.2.0",
    "nltk>=3.10.3",
    "numpy>=2.5.3",
    "pandas>=2.3.3",
    "python-dotenv>=1.2.3",
    "rouge-score>=0.1.2",
    "tabulate>=0.10.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
